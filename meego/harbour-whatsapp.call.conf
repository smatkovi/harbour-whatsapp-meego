# Ereignistyp fuer einen eingehenden WhatsApp-Anruf.
#
# class=system ist das Entscheidende: solche Meldungen erscheinen als
# Banner ueber allem, auch am Sperrbildschirm. Eine gewoehnliche
# Anwendungsmeldung taete das nicht -- und im Feld war genau das zu sehen:
# der Anruf tauchte nur in der Anwendungsuebersicht und in der oberen
# Leiste auf.
class=system
userRemovable=false
persistent=false
iconId=icon-m-telephony-call-ongoing
previewIconId=icon-s-status-call-ongoing
